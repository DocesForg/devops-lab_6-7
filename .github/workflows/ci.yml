name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and security checks (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: "host=localhost port=5432 dbname=employees user=employee_user password=ci_password sslmode=disable"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: employees
          POSTGRES_USER: employee_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U employee_user -d employees"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27.1', 'stable']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Resolve and verify module graph
        run: go mod tidy

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      # Keep the checks split between the two matrix jobs as required by the lab:
      # govulncheck runs on stable; gosec runs on Go 1.27.1.
      - name: Install govulncheck
        if: matrix.go-version == 'stable'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go vulnerabilities
        if: matrix.go-version == 'stable'
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Install gosec
        if: matrix.go-version == '1.27.1'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Static security analysis (gosec)
        if: matrix.go-version == '1.27.1'
        run: $(go env GOPATH)/bin/gosec -exclude-generated ./...

      - name: Upload coverage artifact
        if: always() && matrix.go-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            go.sum
          if-no-files-found: warn
          retention-days: 14
