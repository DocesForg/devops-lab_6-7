name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and security checks (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27.1', 'stable']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Resolve and verify module graph
        run: go mod tidy

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Install govulncheck
        if: matrix.go-version == 'stable'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go vulnerabilities
        if: matrix.go-version == 'stable'
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Install gosec
        if: matrix.go-version == '1.27.1'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Static security analysis (gosec)
        if: matrix.go-version == '1.27.1'
        run: $(go env GOPATH)/bin/gosec ./...

      - name: Upload coverage artifact
        if: always() && matrix.go-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14
