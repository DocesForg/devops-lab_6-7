name: Generate protobuf code

on:
  push:
    branches: [main]
    paths:
      - 'employee.proto'
      - '.github/workflows/generate-proto.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Install Go protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Generate Go code
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          protoc --proto_path=. \
            --go_out=. --go_opt=module=github.com/DocesForg/devops-lab_6-7 \
            --go-grpc_out=. --go-grpc_opt=module=github.com/DocesForg/devops-lab_6-7 \
            employee.proto
      - name: Commit generated Go code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gen/employee/v1/*.go
          if git diff --cached --quiet; then
            echo "Generated protobuf code is already up to date."
          else
            git commit -m "Generate protobuf Go code"
            git push
          fi
      - name: Upload generated Go files
        uses: actions/upload-artifact@v4
        with:
          name: generated-proto
          path: gen/employee/v1/*.go
          if-no-files-found: error
          retention-days: 7
